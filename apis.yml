aid: hallow
name: Hallow
description: >-
  Hallow is the #1 Catholic and Christian prayer, meditation, and Bible app, offering
  guided daily prayer, the Rosary, Lectio Divina, the Examen, Christian meditation,
  faith-based sleep stories, Scripture readings, and audio-guided sessions led by
  well-known voices. Founded in 2018 and based in Chicago, Hallow is a consumer mobile
  application (iOS and Android) with a subscription tier (Hallow Plus), and it runs
  programs for parishes, families, and gifting. Hallow does not currently publish a
  public developer API, SDKs, or developer portal, so this profile captures its public
  web and product surface. Backed by General Catalyst, Homebrew, and Uncork Capital.
